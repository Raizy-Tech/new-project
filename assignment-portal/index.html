<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AssignFlow — Assignment Submission Portal</title>
<style>
:root{--bg:#f5f7fb;--surface:#fff;--ink:#172033;--muted:#68738a;--line:#e5e9f2;--brand:#4f46e5;--brand2:#7c3aed;--success:#159957;--danger:#dc3545;--warning:#c47a00;--shadow:0 16px 45px rgba(28,35,56,.09);--radius:18px}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}
.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20}.brand{font-weight:800;font-size:21px;letter-spacing:-.5px}.brand span{color:var(--brand)}.userbar{display:flex;gap:12px;align-items:center}.avatar{width:38px;height:38px;border-radius:50%;background:#ede9fe;color:#5b21b6;display:grid;place-items:center;font-weight:800}.ghost{background:#fff;border:1px solid var(--line);padding:9px 13px;border-radius:10px}
.shell{max-width:1180px;margin:auto;padding:34px 22px}.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 10% 0,#e8e7ff,transparent 35%),radial-gradient(circle at 90% 100%,#e8f3ff,transparent 30%),var(--bg)}.auth-card{width:min(100%,450px);background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:34px}.auth-logo{text-align:center;margin-bottom:24px}.auth-logo .mark{width:58px;height:58px;border-radius:17px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font-weight:900;font-size:24px;margin:0 auto 12px}.auth-logo h1{margin:0;font-size:27px}.auth-logo p{color:var(--muted);margin:8px 0}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f1f3f8;padding:4px;border-radius:12px;margin-bottom:22px}.tabs button{border:0;background:transparent;padding:10px;border-radius:9px;color:var(--muted)}.tabs button.active{background:#fff;color:var(--ink);box-shadow:0 2px 7px #dfe2ea}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid #d9deea;border-radius:11px;padding:11px 12px;outline:0;background:#fff}.field input:focus,.field textarea:focus{border-color:#8b83f7;box-shadow:0 0 0 3px #ecebff}.primary{width:100%;border:0;border-radius:11px;padding:12px 16px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-weight:750;margin-top:8px}.hint{font-size:12px;color:var(--muted);line-height:1.5}.error{color:var(--danger);font-size:13px;margin-top:10px}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:28px}.hero h1{font-size:32px;margin:0 0 6px;letter-spacing:-1px}.hero p{color:var(--muted);margin:0}.actions{display:flex;gap:10px}.btn{border:0;border-radius:11px;padding:10px 15px;font-weight:700}.btn.primary2{background:var(--brand);color:#fff}.btn.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:26px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:19px;box-shadow:0 7px 22px rgba(28,35,56,.04)}.stat .num{font-size:28px;font-weight:850;margin-top:6px}.stat .label{color:var(--muted);font-size:13px}.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 7px 22px rgba(28,35,56,.04);overflow:hidden}.cardhead{padding:19px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.cardhead h2{font-size:17px;margin:0}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{text-align:left;padding:14px 18px;border-bottom:1px solid #eef0f5;font-size:13px}.table th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;background:#fafbfc}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800}.submitted{background:#e9f8ef;color:#147a43}.late{background:#fff0e7;color:#a64d00}.missing{background:#ffecef;color:#b42335}.pending{background:#f0efff;color:#5146a8}.assignment-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;padding:20px}.assignment{border:1px solid var(--line);border-radius:16px;padding:18px;position:relative}.assignment h3{margin:0 0 8px;font-size:17px}.assignment p{margin:0 0 15px;color:var(--muted);font-size:13px;line-height:1.5}.meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-bottom:14px}.upload{border:1px dashed #bfc6d8;border-radius:12px;padding:13px;background:#fafbfe}.upload input{width:100%;font-size:12px}.modalback{position:fixed;inset:0;background:rgba(18,24,40,.45);display:grid;place-items:center;padding:20px;z-index:50}.modal{background:#fff;width:min(100%,570px);max-height:90vh;overflow:auto;border-radius:20px;box-shadow:var(--shadow);padding:24px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0}.close{border:0;background:#f1f3f8;width:34px;height:34px;border-radius:9px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.empty{padding:45px;text-align:center;color:var(--muted)}.student-note{background:#f4f3ff;color:#5146a8;padding:12px 14px;border-radius:12px;font-size:12px;margin:0 20px 5px}.markinput{width:85px;padding:8px;border:1px solid var(--line);border-radius:8px}.remarkinput{width:170px;padding:8px;border:1px solid var(--line);border-radius:8px}.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:#fff;padding:13px 16px;border-radius:12px;box-shadow:var(--shadow);z-index:100;font-size:13px}
@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.assignment-grid{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.row{grid-template-columns:1fr}.topbar{padding:0 15px}.shell{padding:24px 14px}.hero h1{font-size:27px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY='assignflow_v1';
const seed={users:[{id:'p1',name:'Dr. Priya Sharma',email:'professor@demo.com',password:'prof123',role:'professor'},{id:'s1',name:'Arjun Kumar',email:'student@demo.com',password:'student123',role:'student'}],assignments:[{id:'a1',title:'Operating Systems — Process Scheduling',description:'Explain FCFS, SJF, Round Robin and priority scheduling with one worked example each.',deadline:new Date(Date.now()+86400000*2).toISOString(),fileName:'OS_Assignment_01.pdf',createdBy:'p1'}],submissions:[],session:null};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||seed;
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}
function fmt(d){return new Date(d).toLocaleString([], {dateStyle:'medium',timeStyle:'short'})}
function statusFor(a,s){if(s)return new Date(s.submittedAt)>new Date(a.deadline)?'late':'submitted';return new Date()>new Date(a.deadline)?'missing':'pending'}
function downloadText(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function auth(){document.body.innerHTML='<div class="auth"><div class="auth-card"><div class="auth-logo"><div class="mark">A</div><h1>AssignFlow</h1><p>Assignment Submission Portal</p></div><div class="tabs"><button id="studentTab" class="active" onclick="setRole(\'student\')">Student</button><button id="profTab" onclick="setRole(\'professor\')">Professor</button></div><form onsubmit="login(event)"><div class="field"><label>Email</label><input id="email" type="email" required placeholder="you@college.edu"></div><div class="field"><label>Password</label><input id="password" type="password" required placeholder="••••••••"></div><button class="primary">Login</button><div id="authError" class="error"></div></form><p style="text-align:center;margin:20px 0 8px;font-size:13px;color:#68738a">New here?</p><button class="btn secondary" style="width:100%" onclick="registerForm()">Create an account</button><p class="hint" style="margin-top:16px">Demo: student@demo.com / student123 · professor@demo.com / prof123</p></div></div>'}
let selectedRole='student';
function setRole(r){selectedRole=r;studentTab.classList.toggle('active',r==='student');profTab.classList.toggle('active',r==='professor')}
function login(e){e.preventDefault();const u=db.users.find(x=>x.email.toLowerCase()===email.value.toLowerCase()&&x.password===password.value&&x.role===selectedRole);if(!u){authError.textContent='Invalid credentials or wrong portal.';return}db.session=u.id;save();render()}
function registerForm(){document.querySelector('.auth-card').innerHTML='<div class="auth-logo"><div class="mark">A</div><h1>Create account</h1><p>Join AssignFlow</p></div><div class="field"><label>Full name</label><input id="rname" required></div><div class="field"><label>Email</label><input id="remail" type="email" required></div><div class="field"><label>Password</label><input id="rpass" type="password" minlength="6" required></div><div class="field"><label>Account type</label><select id="rrole"><option value="student">Student</option><option value="professor">Professor</option></select></div><button class="primary" onclick="register(event)">Create account</button><button class="btn secondary" style="width:100%;margin-top:10px" onclick="auth()">Back to login</button>'}
function register(e){e.preventDefault();if(db.users.some(u=>u.email.toLowerCase()===remail.value.toLowerCase())){toast('Email already registered');return}const u={id:crypto.randomUUID(),name:rname.value,email:remail.value,password:rpass.value,role:rrole.value};db.users.push(u);db.session=u.id;save();render();toast('Account created')}
function logout(){db.session=null;save();auth()}
function render(){const u=db.users.find(x=>x.id===db.session);if(!u){auth();return}document.body.innerHTML='<header class="topbar"><div class="brand">Assign<span>Flow</span></div><div class="userbar"><div class="avatar">'+esc(u.name[0])+'</div><div style="font-size:13px"><b>'+esc(u.name)+'</b><div style="color:#68738a;text-transform:capitalize">'+u.role+'</div></div><button class="ghost" onclick="logout()">Logout</button></div></header><main class="shell">'+(u.role==='professor'?professor(u):student(u))+'</main><div id="modal"></div>'}
function professor(u){const subs=db.submissions;const late=subs.filter(s=>statusFor(db.assignments.find(a=>a.id===s.assignmentId),s)==='late').length;return '<div class="hero"><div><h1>Professor Dashboard</h1><p>Manage assignments, deadlines, submissions and grading.</p></div><div class="actions"><button class="btn primary2" onclick="newAssignment()">+ Post assignment</button></div></div><div class="stats"><div class="stat"><div class="label">Assignments</div><div class="num">'+db.assignments.length+'</div></div><div class="stat"><div class="label">Submissions</div><div class="num">'+subs.length+'</div></div><div class="stat"><div class="label">Late submissions</div><div class="num">'+late+'</div></div><div class="stat"><div class="label">Students</div><div class="num">'+db.users.filter(x=>x.role==='student').length+'</div></div></div><div class="card"><div class="cardhead"><h2>Assignments & submissions</h2></div><div class="assignment-grid">'+(db.assignments.map(a=>{const ss=subs.filter(s=>s.assignmentId===a.id);return '<div class="assignment"><h3>'+esc(a.title)+'</h3><p>'+esc(a.description)+'</p><div class="meta"><span>Deadline: '+fmt(a.deadline)+'</span><span>PDF: '+esc(a.fileName)+'</span></div><div class="meta"><span class="badge submitted">'+ss.filter(s=>statusFor(a,s)==='submitted').length+' on time</span><span class="badge late">'+ss.filter(s=>statusFor(a,s)==='late').length+' late</span></div><button class="btn secondary" onclick="gradeAssignment(\''+a.id+'\')">View & grade submissions</button></div>'}).join('')||'<div class="empty">No assignments yet.</div>')+'</div></div>'}
function student(u){return '<div class="hero"><div><h1>Student Dashboard</h1><p>Track your assignments, submit PDFs and view feedback.</p></div></div><div class="stats"><div class="stat"><div class="label">Available</div><div class="num">'+db.assignments.length+'</div></div><div class="stat"><div class="label">Submitted</div><div class="num">'+db.submissions.filter(s=>s.studentId===u.id).length+'</div></div><div class="stat"><div class="label">Graded</div><div class="num">'+db.submissions.filter(s=>s.studentId===u.id&&s.marks!=null).length+'</div></div><div class="stat"><div class="label">Late</div><div class="num">'+db.submissions.filter(s=>{const a=db.assignments.find(a=>a.id===s.assignmentId);return s.studentId===u.id&&statusFor(a,s)==='late'}).length+'</div></div></div><div class="card"><div class="cardhead"><h2>My assignments</h2></div><div class="assignment-grid">'+db.assignments.map(a=>{const s=db.submissions.find(x=>x.assignmentId===a.id&&x.studentId===u.id);const st=statusFor(a,s);return '<div class="assignment"><h3>'+esc(a.title)+'</h3><p>'+esc(a.description)+'</p><div class="meta"><span>Deadline: '+fmt(a.deadline)+'</span><span class="badge '+st+'">'+st.toUpperCase()+'</span></div><div class="upload">'+(s?'<b>Submitted:</b> '+esc(s.fileName)+'<br><small style="color:#68738a">'+fmt(s.submittedAt)+'</small>'+(s.marks!=null?'<div style="margin-top:10px"><b>Grade: '+s.marks+'</b><br><span style="color:#68738a">'+esc(s.remarks||'No remarks')+'</span></div>':''):'<input type="file" id="file-'+a.id+'" accept=".pdf,application/pdf" onchange="submitPDF(\''+a.id+'\',this)">')+'</div></div>'}).join('')}</div></div>'}
function newAssignment(){modal.innerHTML='<div class="modalback"><div class="modal"><div class="modalhead"><h2>Post assignment</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Title</label><input id="atitle" placeholder="e.g. Database Normalization"></div><div class="field"><label>Description</label><textarea id="adesc" rows="4" placeholder="Instructions for students"></textarea></div><div class="row"><div class="field"><label>Deadline</label><input id="adeadline" type="datetime-local"></div><div class="field"><label>Assignment PDF</label><input id="afile" type="file" accept=".pdf,application/pdf"></div></div><button class="primary" onclick="createAssignment()">Publish assignment</button></div></div>'}
function createAssignment(){if(!atitle.value||!adeadline.value){toast('Title and deadline are required');return}const f=afile.files[0];if(f&&f.type!=='application/pdf'){toast('Please attach a PDF');return}db.assignments.push({id:crypto.randomUUID(),title:atitle.value,description:adesc.value,deadline:new Date(adeadline.value).toISOString(),fileName:f?.name||'No PDF attached',createdBy:db.session});save();closeModal();render();toast('Assignment published')}
function closeModal(){modal.innerHTML=''}
function gradeAssignment(id){const a=db.assignments.find(x=>x.id===id);const students=db.users.filter(x=>x.role==='student');modal.innerHTML='<div class="modalback"><div class="modal"><div class="modalhead"><div><h2>'+esc(a.title)+'</h2><p class="hint">Deadline: '+fmt(a.deadline)+'</p></div><button class="close" onclick="closeModal()">×</button></div><div class="tablewrap"><table class="table" style="min-width:100%"><thead><tr><th>Student</th><th>Status</th><th>File</th><th>Marks</th><th>Remarks</th></tr></thead><tbody>'+students.map(st=>{const s=db.submissions.find(x=>x.assignmentId===id&&x.studentId===st.id);const status=statusFor(a,s);return '<tr><td><b>'+esc(st.name)+'</b><br><small>'+esc(st.email)+'</small></td><td><span class="badge '+status+'">'+status+'</span></td><td>'+(s?esc(s.fileName):'—')+'</td><td>'+(s?'<input class="markinput" type="number" min="0" max="100" value="'+(s.marks??'')+'" onchange="grade(\''+s.id+'\',this.value,null)">':'—')+'</td><td>'+(s?'<input class="remarkinput" value="'+esc(s.remarks||'')+'" onchange="grade(\''+s.id+'',null,this.value)" placeholder="Feedback">':'—')+'</td></tr>'}).join('')+'</tbody></table></div><p class="hint" style="margin-top:16px">Missing students are those with no submission after the deadline. Late submissions are detected automatically from the submission timestamp.</p></div></div>'}
function grade(id,marks,remarks){const s=db.submissions.find(x=>x.id===id);if(marks!==null)s.marks=Number(marks);if(remarks!==null)s.remarks=remarks;save();toast('Grade saved')}
function submitPDF(aid,input){const f=input.files[0];if(!f)return;if(f.type!=='application/pdf'){toast('Only PDF files are accepted');input.value='';return}if(f.size>4*1024*1024){toast('PDF must be under 4 MB');input.value='';return}const a=db.assignments.find(x=>x.id===aid);const reader=new FileReader();reader.onload=()=>{db.submissions.push({id:crypto.randomUUID(),assignmentId:aid,studentId:db.session,fileName:f.name,submittedAt:new Date().toISOString(),fileData:reader.result,marks:null,remarks:''});save();render();toast(new Date()>new Date(a.deadline)?'Submitted late — status recorded automatically':'Assignment submitted successfully')};reader.readAsDataURL(f)}
render();
</script>
</body>
</html>
