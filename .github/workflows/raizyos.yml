name: RaizyOS ARM64

on:
  push:
    paths:
      - 'os/**'
      - '.github/workflows/raizyos.yml'
  pull_request:
    paths:
      - 'os/**'
      - '.github/workflows/raizyos.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: os
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM64 toolchain and QEMU
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-system-arm
      - name: Build kernel
        run: make CROSS=aarch64-linux-gnu-
      - name: Verify ELF
        run: aarch64-linux-gnu-readelf -h build/kernel.elf
      - name: QEMU boot smoke test
        shell: bash
        run: |
          set +e
          timeout 8s qemu-system-aarch64 -M virt -cpu cortex-a53 -m 128M -nographic -monitor none -kernel build/kernel.elf > /tmp/raizyos-qemu.log 2>&1
          status=$?
          cat /tmp/raizyos-qemu.log
          if [ "$status" -ne 124 ] && [ "$status" -ne 137 ]; then
            echo "QEMU exited unexpectedly with status $status"
            exit 1
          fi
          grep -q "Kernel booted successfully." /tmp/raizyos-qemu.log
          grep -q "Milestone 2: exception vectors ONLINE" /tmp/raizyos-qemu.log
          grep -q "Cause: SVC instruction from AArch64." /tmp/raizyos-qemu.log
          grep -q "SVC returned successfully." /tmp/raizyos-qemu.log
          grep -q "Milestone 3: generic timer initialization" /tmp/raizyos-qemu.log
          grep -q "Timer: ARM generic timer configured for 100 ms." /tmp/raizyos-qemu.log
