name: RaizyOS ARM64

on:
  push:
    paths:
      - 'os/**'
      - '.github/workflows/raizyos.yml'
  pull_request:
    paths:
      - 'os/**'
      - '.github/workflows/raizyos.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: os
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM64 toolchain and QEMU
        run: sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-system-arm
      - name: Build kernel
        run: make CROSS=aarch64-linux-gnu-
      - name: Verify ELF
        run: aarch64-linux-gnu-readelf -h build/kernel.elf
      - name: QEMU timer IRQ smoke test
        shell: bash
        run: |
          set +e
          timeout 5s qemu-system-aarch64 -M virt,gic-version=3,highmem-redists=off -bios none -cpu cortex-a53 -m 128M -nographic -monitor none -kernel build/kernel.elf > /tmp/raizyos-qemu.log 2>&1
          status=$?
          cat /tmp/raizyos-qemu.log
          if [ "$status" -ne 124 ] && [ "$status" -ne 137 ] && [ "$status" -ne 143 ]; then
            echo "QEMU exited unexpectedly with status $status"
            exit 1
          fi
          grep -q "Kernel booted successfully." /tmp/raizyos-qemu.log
          grep -q "Cause: SVC instruction from AArch64." /tmp/raizyos-qemu.log
          grep -q "SVC returned successfully." /tmp/raizyos-qemu.log
          grep -q "Milestone 4: timer IRQs ONLINE" /tmp/raizyos-qemu.log
          grep -q "\[TIMER\] tick 0x000000000000000a" /tmp/raizyos-qemu.log
          grep -q "\[TIMER\] tick 0x0000000000000014" /tmp/raizyos-qemu.log
          grep -q "Milestone 6: physical memory manager..." /tmp/raizyos-qemu.log
          grep -q "PMM: using DTB-discovered RAM." /tmp/raizyos-qemu.log
          grep -q "PMM: 4 KiB page allocator ONLINE." /tmp/raizyos-qemu.log
          grep -q "PMM: page read/write + reclaim test PASSED." /tmp/raizyos-qemu.log
          grep -q "DTB: valid flattened device tree." /tmp/raizyos-qemu.log
          grep -q "Milestone 7: DTB hardware discovery ONLINE" /tmp/raizyos-qemu.log
          grep -q "VM: 4 KiB page mapping read/write test PASSED." /tmp/raizyos-qemu.log
          grep -q "DTB: UART base = 0x0000000009000000" /tmp/raizyos-qemu.log
          grep -q "DTB: GICD base = 0x0000000008000000" /tmp/raizyos-qemu.log
          grep -q "DTB: GICR base = 0x00000000080a0000" /tmp/raizyos-qemu.log
          grep -q "DTB: timer PPI = 0x000000000000001e" /tmp/raizyos-qemu.log
          grep -q "Milestone 9: user process + syscall boundary..." /tmp/raizyos-qemu.log
          grep -q "\[PROCESS\] ELF load PASSED." /tmp/raizyos-qemu.log
          grep -q "\[PROCESS\] entering EL0." /tmp/raizyos-qemu.log
          grep -q "\[SYSCALL\] write handled." /tmp/raizyos-qemu.log
          grep -q "\[SYSCALL\] getpid handled." /tmp/raizyos-qemu.log
          grep -q "\[SYSCALL\] yield handled (non-blocking)." /tmp/raizyos-qemu.log
          grep -q "\[SYSCALL\] exit requested." /tmp/raizyos-qemu.log
          grep -q "Scheduler: cooperative + timer preemption PASSED." /tmp/raizyos-qemu.log
          grep -q "Milestone 10: console + RAM filesystem + shell..." /tmp/raizyos-qemu.log
          grep -q "RAMFS: read-only bootstrap files ONLINE." /tmp/raizyos-qemu.log
          grep -q "RAMFS: writable create/write/remove test PASSED." /tmp/raizyos-qemu.log
          grep -q "Shell: command parser test PASSED." /tmp/raizyos-qemu.log
          grep -q "Shell: ls/cat/echo command paths PASSED." /tmp/raizyos-qemu.log
